<script type="module">
  import { montarHoja } from './qa/hoja.js';
  import { VERSION } from './core/constants.js';
  import { recentErrors } from './core/errorLog.js';
  import { getAuthToken } from './core/auth.js';
  import { submitQaRound } from './core/reports.js';

  const app = document.getElementById('app');
  try {
    // cache-bust con la versión: al publicar una ronda nueva no hace falta
    // pelearse con la caché del móvil.
    const ronda = await (await fetch(`./qa/ronda-actual.json?v=${encodeURIComponent(VERSION)}`)).json();
    montarHoja(app, {
      ronda,
      // El bloque que antes había que pegar a mano (Q6): versión, pantalla y
      // últimos errores registrados por la app — va solo en cada informe.
      contexto: () => {
        const errs = (recentErrors() || []).slice(0, 5)
          .map(e => `· ${e.ts || ''} ${e.msg || e.message || e}`).join('\n');
        return `app v${VERSION} · ${navigator.userAgent.slice(0, 80)}\núltimos errores:\n${errs || '(ninguno registrado)'}`;
      },
      // Guardar en el panel exige sesión de profe (regla de `reports`), pero eso
      // NO puede bloquear la entrega: el probador no tiene por qué ser profe.
      // Se dice como AVISO —qué vía se va a usar— y el botón entrega igual por
      // la hoja de compartir del móvil o copiando. Si abre sesión en otra
      // pestaña, esta re-revisa al volver y usará la vía buena, sin recargar.
      puedeEnviar: () => getAuthToken() ? null
        : 'Sin cuenta de profe no se guarda en el panel, pero puedes entregarlo igual: «Entregar informe» lo manda por WhatsApp o correo desde tu móvil. (Si tienes cuenta, ábrela en otra pestaña y vuelve: se guardará en el panel.)',
      enviar: ({ rondaId, texto }) => submitQaRound(rondaId, texto),
    });
  } catch (e) {
    app.innerHTML = `<p style="text-align:center;padding:3rem 1rem;color:#b3402f">No se pudo cargar la ronda (${e?.message || e}). Recarga con Ctrl+F5.</p>`;
  }
</script>
