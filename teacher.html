<div id="app"></div>

<script>
// Cache buster + error boundary. Loaded INLINE before any module so it
// keeps working even if module fetch fails.
// Caché HTTP (donde viven los ES modules con max-age=600): re-pedir cada
// recurso propio con cache:'reload' — un reload normal NO los refresca.
window.__wwHardRefetch = async function() {
  try {
    const urls = new Set([location.origin + location.pathname]);
    for (const e of performance.getEntriesByType('resource')) {
      const u = String(e.name || '');
      if (u.startsWith(location.origin)) urls.add(u.split('?')[0]);
    }
    await Promise.allSettled([...urls].map(u => fetch(u, { cache: 'reload' })));
  } catch {}
};
window.__wwClearAll = async function() {
  if (!confirm('¿Borrar todo (caché del navegador + datos locales) y recargar?')) return;
  try { localStorage.clear(); } catch {}
  try { sessionStorage.clear(); } catch {}
  if ('caches' in window) {
    try { const names = await caches.keys(); await Promise.all(names.map(n => caches.delete(n))); } catch {}
  }
  if ('serviceWorker' in navigator) {
    try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch {}
  }
  await window.__wwHardRefetch();
  // Bypass disk cache by adding a unique query string.
  location.href = location.pathname + '?_=' + Date.now() + location.hash;
};
// Actualizar SOLO el código (cargar versión nueva) SIN borrar datos locales.
window.__wwRefresh = async function() {
  if ('caches' in window) { try { const ns = await caches.keys(); await Promise.all(ns.map(n => caches.delete(n))); } catch {} }
  if ('serviceWorker' in navigator) { try { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.unregister())); } catch {} }
  await window.__wwHardRefetch();
  location.href = location.pathname + '?_=' + Date.now() + location.hash;
};
// Eliminación AGRESIVA del Service Worker + toda la caché (mantiene tus datos).
// Manda skipWaiting a cualquier SW en espera, desregistra TODOS, borra todas las
// cachés y recarga saltando la caché de disco. Para cuando un deploy se "pega".
window.__wwNukeSW = async function() {
  if (!confirm('¿Eliminar el Service Worker y TODA la caché, y recargar? (mantiene tus actividades y datos)')) return;
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(async r => {
        try { (r.waiting || r.installing)?.postMessage({ type: 'SKIP_WAITING' }); } catch {}
        try { await r.unregister(); } catch {}
      }));
    }
    if ('caches' in window) { const ns = await caches.keys(); await Promise.all(ns.map(n => caches.delete(n))); }
  } catch (e) { console.warn('[nukeSW]', e); }
  location.href = location.pathname + '?_=' + Date.now() + location.hash;
};
// Error boundary: any uncaught error or rejection paints a red banner.
(function(){
  let shown = false;
  function show(msg){
    if (shown) return; shown = true;
    const el = document.getElementById('app') || document.body;
    el.innerHTML = '<div class="alert alert-danger m-4"><h4 class="alert-heading"><i class="bi bi-bug-fill"></i> Error</h4><pre style="white-space:pre-wrap">'+String(msg).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre><button class="btn btn-sm btn-light" onclick="location.reload()">Reintentar</button></div>';
  }
  // "ResizeObserver loop…" es un AVISO benigno del navegador (el observer
  // difiere notificaciones un frame), no un crash: no tumbar la app por él.
  window.addEventListener('error', e => {
    if (/ResizeObserver loop/i.test(e.message || '')) return;
    show(e.error?.stack || e.message);
  });
  window.addEventListener('unhandledrejection', e => show(e.reason?.stack || e.reason));
  // 8s watchdog: if main.teacher.js never marks ready, show fallback
  setTimeout(()=>{ if (!window.__APP_READY__) show('La aplicación no inició en 8s. Revisa consola.'); }, 8000);
})();
</script>
<script type="module">

</script>
